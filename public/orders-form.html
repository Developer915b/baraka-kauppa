<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Baraka Kauppa — Order Processing</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f4; color: #44403c; }
    main { text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Baraka Kauppa</h1>
    <p>This page processes online orders. Nothing to see here — head back to the shop!</p>
    <p><a href="/">← Back to Baraka Kauppa</a></p>
  </main>

  <!--
    Netlify Forms declaration (static file required by @netlify/plugin-nextjs v5).
    The cart drawer POSTs order details here via AJAX after successful checkout.
    Submissions appear in the Netlify dashboard (Forms → orders) and can trigger
    email notifications.
  -->
  <form name="orders" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="orders" />
    <input name="orderNo" />
    <input name="customerName" />
    <input name="phone" />
    <input name="email" />
    <input name="method" />
    <input name="address" />
    <input name="city" />
    <input name="postalCode" />
    <input name="notes" />
    <textarea name="items"></textarea>
    <input name="subtotal" />
    <input name="deliveryFee" />
    <input name="total" />
  </form>
</body>
</html>
