# Netlify deployment configuration for Baraka Kauppa (Next.js 16)
# Docs: https://docs.netlify.com/frameworks/next.js/overview/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Baked into the client bundle at build time; enables Netlify Forms order submission
  NEXT_PUBLIC_NETLIFY = "true"
  # Skip Prisma engine download for platforms we don't deploy to (faster installs)
  PRISMA_SKIP_POSTINSTALL_GENERATE = "false"
  # Supabase project (products + orders database)
  SUPABASE_URL = "https://gyqdrwbpgeaironcsphe.supabase.co"
  SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vLem2B8sZQXPZBi-kri9qA_etXHck4u"
  # SECRETS — set these in the Netlify UI (Site configuration -> Environment
  # variables), NOT in this file (GitHub push protection blocks committed secrets):
  #   SUPABASE_SECRET_KEY  = sb_secret_...  (admin panel + order persistence)
  #   ADMIN_PASSWORD       = your admin panel password (min 6 chars)

# Official Next.js runtime: handles SSR, API routes, image optimisation, ISR, etc.
[[plugins]]
  package = "@netlify/plugin-nextjs"
